<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>11월, 우리에게 오는 아침</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#4b2729;color:#fff;font-family:system-ui,'Noto Sans KR',sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:12px;background:radial-gradient(circle at 50% 20%,#9e5c48,#3b1b26 75%)}button{border:0;cursor:pointer}#envelope{position:relative;width:min(90vw,420px);aspect-ratio:1.35;background:linear-gradient(145deg,#fff0da,#eab7a9);border-radius:10px;box-shadow:0 25px 60px #19070b99;overflow:hidden;transition:transform .7s}#envelope:before{content:'';position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 58%);background:linear-gradient(#f9d8cb,#f2b7ac);filter:drop-shadow(0 3px 4px #7b4745)}#envelope:after{content:'💗';position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:62px;text-shadow:0 4px 10px #ab536b}#envelope span{position:absolute;z-index:2;top:12%;left:0;right:0;text-align:center;color:#753b40;font-weight:700;font-size:clamp(18px,5vw,27px)}#hint{text-align:center;margin-top:24px;color:#fff1dc}#stage{width:min(100%,560px);display:none}video{width:100%;max-height:96dvh;object-fit:contain;display:block;border-radius:8px}#again{margin:12px auto;display:block;background:#f9d7c3;color:#54262e;padding:12px 20px;border-radius:30px;font-weight:700}body.open #intro{display:none}body.open #stage{display:block}</style></head><body><main><section id="intro"><button id="envelope" aria-label="봉투를 열고 영상 재생"><span>제임스 쿠님께 ♡</span></button><p id="hint">봉투를 눌러 마음을 열어 보세요 🍁</p></section><section id="stage"><video id="film" controls playsinline preload="metadata" src="video.mp4"></video><button id="again">다시 봉투 보기</button></section></main><script>const film=document.querySelector('#film');document.querySelector('#envelope').onclick=()=>{document.body.classList.add('open');film.play().catch(()=>{});};document.querySelector('#again').onclick=()=>{film.pause();film.currentTime=0;document.body.classList.remove('open')};</script></body></html>
